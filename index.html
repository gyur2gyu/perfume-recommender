<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나에게 맞는 향수 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--sf:#fff;--tint:#e4f6ea;--ink:#111816;--mut:#5b6761;--acc:#00803a;--onacc:#fff;--line:#dce4df;
--serif:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1411;--sf:#151d19;--tint:#14301f;--ink:#eef4f0;--mut:#9fb0a7;--acc:#3ddc84;--onacc:#04140a;--line:#26332c}}
:root[data-theme="dark"]{--bg:#0e1411;--sf:#151d19;--tint:#14301f;--ink:#eef4f0;--mut:#9fb0a7;--acc:#3ddc84;--onacc:#04140a;--line:#26332c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:20px 22px 28px}
.top{height:44px;display:flex;align-items:center;gap:14px}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;visibility:hidden}
.bar{flex:1;height:1px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:0;transition:width .6s cubic-bezier(.3,.7,.2,1)}
.cnt{font-size:13px;color:var(--mut);min-width:28px;text-align:right}
main{flex:1;display:flex;flex-direction:column;padding-top:28px}
.step{animation:in .55s cubic-bezier(.3,.7,.2,1) both;display:flex;flex-direction:column;flex:1}
.step.out{animation:out .28s ease-in both}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-26px)}}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;letter-spacing:-.01em}
h1{font-size:40px;line-height:1.3}
h2{font-size:28px;line-height:1.4;margin-bottom:10px}
.sub{color:var(--mut);font-size:15px;margin:0 0 26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:14px 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.opt b{display:block;font-weight:500;font-size:15px}
.opt span{display:block;font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:2px}
.opt.on{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.opt.on span{color:inherit;opacity:.75}
.opt .rk{position:absolute;right:10px;top:8px;font-size:12px;opacity:0}
.opt.on .rk{opacity:.9}
.list{display:flex;flex-direction:column;gap:10px}
.list .opt{padding:16px}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.foot{margin-top:auto;padding-top:26px}
.btn{width:100%;font:500 16px var(--sans);padding:16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.28;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.intro{justify-content:center;padding-bottom:8vh}
.intro p{color:var(--mut);margin:18px 0 40px}
.stage{justify-content:center;align-items:flex-start;padding-bottom:10vh}
.stage .msg{font-family:var(--serif);font-weight:300;font-size:24px;min-height:70px;transition:opacity .4s}
.stage .notes{color:var(--mut);font-size:14px;margin-top:8px;min-height:22px}
.thin{width:100%;height:1px;background:var(--line);margin-top:34px;position:relative}
.thin i{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0;transition:width .9s linear}
.top1{border-top:1px solid var(--ink);padding-top:22px;margin-top:6px}
.pct{font-size:13px;color:var(--mut)}
.pname{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.35;margin:6px 0 4px}
.brand{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.chips em{font-style:normal;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.why{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.9}
.meta{font-size:13px;color:var(--mut);margin-top:12px}
.more{margin-top:34px}
.more h3{font-size:18px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:500;display:block}
.row span{font-size:13px;color:var(--mut)}
.row .p{white-space:nowrap;font-size:13px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.bt{display:flex;align-items:center;gap:10px;height:36px;font:500 15px var(--serif);letter-spacing:.02em}
.bi{width:16px;height:20px;flex:none;color:var(--acc)}
h1,h2,h3{font-weight:500}
h1{font-size:42px;line-height:1.35}
h2{font-size:27px;line-height:1.45}
.qn{color:var(--acc);font-size:14px;font-weight:500;margin-bottom:12px}
.bar{height:3px;background:var(--line);-webkit-mask:repeating-linear-gradient(90deg,#000 0,#000 calc(16.667% - 5px),transparent calc(16.667% - 5px),transparent 16.667%);mask:repeating-linear-gradient(90deg,#000 0,#000 calc(16.667% - 5px),transparent calc(16.667% - 5px),transparent 16.667%)}
.bar i{top:0;height:3px;background:var(--acc)}
.cnt{display:none}
.opt{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px}
.opt.on{background:var(--tint);color:var(--ink);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.on span{color:var(--mut);opacity:1}
.opt.on .rk{color:var(--acc);opacity:1;font-weight:500}
.btn{background:var(--acc);color:var(--onacc);border-color:var(--acc);border-radius:14px}
.btn:disabled{background:var(--line);color:var(--mut);border-color:var(--line);opacity:1}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.top1{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:24px}
.pct{color:var(--acc);font-weight:500}
.chips em{background:var(--tint);color:var(--acc);border:0}
.why{font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.85}
.thin{height:3px;background:var(--line)}
.thin i{top:0;height:3px;background:var(--acc)}
@media (min-width:720px){body{display:flex;align-items:center}.app{width:100%;max-width:440px;min-height:0;height:min(820px,92vh);background:var(--sf);border:1px solid var(--line);border-radius:28px;padding:26px 26px 30px;overflow-y:auto;box-shadow:0 20px 60px rgba(29,27,38,.08)}}
h1,h2,h3,.pname,.stage .msg{font-weight:800;letter-spacing:-.03em}
h1{font-size:44px;line-height:1.25}
h2{font-size:27px;line-height:1.35}
.bt{font-weight:700;letter-spacing:-.01em}
.qn{font-weight:700;font-size:15px}
.pct{font-weight:700}
.opt b,.row b{font-weight:700}
.btn{font-weight:700}
.why{font-weight:400;color:var(--ink)}
.btn{background:#03c75a;border-color:#03c75a;color:#04140a}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mut)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.pname{font-size:26px;line-height:1.35}
.row .p{text-align:right}
</style>
</head>

const PERFUMES = DATABASE.perfumes;
const LONGEVITY = ["약함","보통","다소 강함","강함"];
function evaluate(p,a){
 const scent=(p.mainImage===a.first?35:0)+(p.mainImage===a.second?20:0)+(p.secondaryImage===a.first?20:0)+(p.secondaryImage===a.second?15:0);
 const lonActive=a.longevity!=='any';
 const lonDiff=lonActive?Math.abs(LONGEVITY.indexOf(p.longevityLevel)-LONGEVITY.indexOf(a.longevity)):0;
 const lon=lonActive?[20,12,5,0][Math.min(3,lonDiff)]:null;
 const seasonActive=a.season!=='any';
 const season=seasonActive?(a.season==='여름'?p.summerFit*10:(p.seasons.includes(a.season)?20:0)):null;
 const occasionActive=a.occasion!=='any';
 const occasion=occasionActive?(p.occasions.includes(a.occasion)?10:0):null;
 const activeMax=50+(lonActive?20:0)+(seasonActive?20:0)+(occasionActive?10:0);
 const earned=scent+(lon??0)+(season??0)+(occasion??0);
 return {p,scent,lon,season,occasion,activeMax,earned,score:Math.round(earned/activeMax*1000)/10};
}
function recommend(a){
 const limit=a.budget==='any'?Infinity:Number(a.budget);
 const affordable=PERFUMES.filter(p=>p.listPriceKrw<=limit);
 const kept=affordable.filter(p=>!a.avoid.includes(p.mainImage));
 const evaluated=kept.map(p=>evaluate(p,a)).sort((x,y)=>y.score-x.score||y.scent-x.scent||y.earned-x.earned||x.p.id-y.p.id);
 return {items:evaluated.slice(0,5),survivors:kept.length,overBudget:PERFUMES.length-affordable.length,avoided:affordable.length-kept.length};
}

 if(a.occasion!=='any'&&r.occasion===10)parts.push(`선택한 사용 상황에 어울리는 향입니다`);

 $("fill").style.width=(i<0?0:Math.min(i+1,6)/6*100)+"%";$("cnt").textContent=(i>=0&&i<6)?(i+1)+"/6":""}
function go(n){const cur=M.firstElementChild;const f=()=>{i=n;render()};
 if(cur){cur.classList.add("out");setTimeout(f,260)}else f()}
function render(){chrome();M.innerHTML="";const d=document.createElement("section");d.className="step";M.appendChild(d);
 if(i<0)return intro(d);if(i<6)return ask(d,Q[i]);if(i===6)return analyze(d);result(d)}
function intro(d){d.classList.add("intro");d.innerHTML='<h1>나에게 맞는<br>향수 찾기</h1><p>여섯 가지 질문으로 취향을 정리하고,<br>어울리는 향수를 골라 드려요.</p><button class="btn" id="go">시작하기</button>';
 $("go").onclick=()=>go(0)}
function ask(d,q){let h='<div class="qn">질문 '+(i+1)+' / 6</div><h2>'+q.t+'</h2><p class="sub">'+(q.s||"")+'</p>';
 if(q.k==="likes"||q.k==="avoid"){
  h+='<div class="grid">'+CATS.map(c=>'<button class="opt" data-v="'+esc(c)+'"'+(q.k==="avoid"&&A.likes.includes(c)?' disabled':'')+'><b>'+esc(c)+'</b><span>'+DESC[c]+'</span><div class="rk"></div></button>').join("")+'</div><div class="foot"><button class="btn" id="nx"></button></div>';
  d.innerHTML=h;const btns=[...d.querySelectorAll(".opt")],nx=$("nx");
  const paint=()=>{btns.forEach(b=>{const v=b.dataset.v;let on,r="";
   if(q.k==="likes"){const x=A.likes.indexOf(v);on=x>-1;r=on?(x?"②":"①"):""}else{on=A.avoid.includes(v);r=on?"✓":""}
   b.classList.toggle("on",on);b.querySelector(".rk").textContent=r});
   if(q.k==="likes"){nx.disabled=A.likes.length<2;nx.textContent=A.likes.length<2?(A.likes.length?"한 가지 더 골라 주세요":"두 가지를 골라 주세요"):"다음"}
   else nx.textContent=A.avoid.length?"다음":"피할 향 없음"};
  btns.forEach(b=>b.onclick=()=>{const v=b.dataset.v;
   if(q.k==="likes"){const x=A.likes.indexOf(v);if(x>-1)A.likes.splice(x,1);else if(A.likes.length<2)A.likes.push(v)}
   else{const x=A.avoid.indexOf(v);x>-1?A.avoid.splice(x,1):A.avoid.push(v)}
   paint()});
  nx.onclick=()=>{if(q.k==="likes")A.avoid=A.avoid.filter(c=>!A.likes.includes(c));go(i+1)};paint();return}
 h+='<div class="list">'+q.o.map(o=>'<button class="opt" data-v="'+esc(o.value)+'"><b>'+esc(o.label)+'</b></button>').join("")+'</div>';d.innerHTML=h;
 const bs=[...d.querySelectorAll(".opt")];
 bs.forEach(b=>{if(A[q.k]===b.dataset.v)b.classList.add("on");
  b.onclick=()=>{A[q.k]=b.dataset.v;bs.forEach(c=>c.classList.toggle("on",c===b));setTimeout(()=>go(i+1),320)}})}
function analyze(d){chrome();$("fill").style.width="100%";d.classList.add("stage");
 RES=recommend(ans());const tot=PERFUMES.length,aff=tot-RES.overBudget;
 const ms=[tot+"종의 향수를 살펴보고 있어요","예산 안에 드는 "+aff+"종을 추리고 있어요","피할 향을 제외한 "+RES.survivors+"종의 점수를 계산하고 있어요"];
 const ns=[A.likes.join(" · ")+" 중심으로 비교하는 중","예산과 사용 조건을 확인하는 중","취향·지속력·계절·상황을 종합하는 중"];
 d.innerHTML='<div class="msg" id="m"></div><div class="notes" id="n"></div><div class="thin"><i id="t"></i></div>';
 let k=0;const m=$("m"),n=$("n"),t=$("t");
 const tick=()=>{if(k>=3)return go(7);m.style.opacity=0;setTimeout(()=>{m.textContent=ms[k];n.textContent=ns[k];m.style.opacity=1;t.style.width=((k+1)/3*100)+"%";k++;setTimeout(tick,1000)},260)};
 tick()}
async function why(r){const base=reasons(r,ans());if(!AI_ENDPOINT)return base;
 try{const x=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answers:ans(),perfume:r.p,reasons:base})});const j=await x.json();return j.text||base}catch(e){return base}}
function reset(){A.likes=[];A.avoid=[];A.longevity=A.season=A.occasion=A.budget=null;go(-1)}
function result(d){chrome();$("cnt").textContent="";
 if(!RES||!RES.items.length){d.innerHTML='<h2>조건에 맞는 향수를 찾지 못했어요</h2><p class="sub">예산을 넓히거나 피할 향을 줄여서 다시 시도해 보세요.</p><div class="foot"><button class="btn" id="re">처음부터 다시 하기</button></div>';$("re").onclick=reset;return}
 const T=RES.items[0],p=T.p;
 d.innerHTML='<div class="top1"><div class="pct">추천 점수 '+T.score.toFixed(1)+'점</div><div class="pname">'+esc(p.koName)+'</div><div class="brand">'+esc(p.koBrand)+' · '+esc(p.brand+" "+p.name)+'</div>'
 +'<div class="chips">'+p.keywords.split(",").map(x=>'<em>'+esc(x.trim())+'</em>').join("")+'</div>'
 +(p.everydayAnalogy?'<div class="meta">'+esc(p.everydayAnalogy)+'</div>':'')
 +'<div class="why" id="w">추천 이유를 정리하는 중이에요…</div>'
 +'<div class="meta">'+p.volumeMl+'ml · 정가 '+won(p.listPriceKrw)+' · 지속력 '+esc(p.longevityLevel)+'</div></div>'
 +(RES.items.length>1?'<div class="more"><h3>함께 보면 좋은 향</h3>'+RES.items.slice(1).map(x=>'<div class="row"><div><b>'+esc(x.p.koName)+'</b><span>'+esc(x.p.koBrand)+' · '+esc(x.p.keywords)+'</span></div><div class="p">'+won(x.p.listPriceKrw)+'<br>'+x.score.toFixed(1)+'점</div></div>').join("")+'</div>':'')
 +'<div class="note">'+PERFUMES.length+'종 중 예산·피할 향 조건으로 '+(RES.overBudget+RES.avoided)+'종을 제외했어요. 가격은 국내 정가 기준이며 할인가는 반영하지 않아요. 향의 느낌과 지속 시간은 개인과 환경에 따라 다를 수 있어요.</div>'
 +'<div class="foot"><button class="btn ghost" id="re">처음부터 다시 하기</button></div>';
 why(T).then(t=>{const w=$("w");if(w)w.textContent=t});$("re").onclick=reset}
$("back").onclick=()=>{if(i>0&&i<6)go(i-1)};
render();
</script>
</body>
</html>
